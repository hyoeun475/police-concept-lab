# Render 블루프린트: AI 튜터 서버 (tutor-server 폴더)
# https://render.com/deploy?repo=https://github.com/hyoeun475/police-concept-lab 로 열면 이 설정대로 서비스가 만들어진다.
services:
  - type: web
    name: police-concept-tutor
    runtime: node
    plan: free
    region: singapore
    rootDir: tutor-server
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY   # 배포할 때 Render 화면에서 직접 입력한다. 저장소에는 넣지 않는다
        sync: false
      - key: ALLOW_ORIGIN        # 웹앱(GitHub Pages) 주소에서 오는 요청만 허용
        value: https://hyoeun475.github.io
      - key: APP_HTML            # 사례 데이터를 읽을 웹앱 파일
        value: ../index.html
      - key: NODE_VERSION
        value: "20"
